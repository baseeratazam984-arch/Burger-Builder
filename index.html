<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Burger Builder</title>
</head>

<body>
    <nav class="navbar">

        <img src="./cute-cartoon-burger-as-builder-character-painting-flat-modern-style-design-illustration-258451882.webp"
            alt="Burger" width="50" height="50">

        <div class="btnhead">
            <button class="btn" id="burger-builder-log-in-page">
                Burger Builder
            </button>

            <button class="btn" id="log-in">
                Login
            </button>
        </div>

    </nav>

    <div>

        <center>

            <div class="burger_scroll">

                <div class="div1"></div>

                <div id="no_ingredients">
                    <h1>No Ingredients Added</h1>
                </div>

                <div id="burger"></div>
                <div id="burger1"></div>
                <div id="burger2"></div>
                <div id="burger3"></div>

                <div class="div6"></div>

            </div>

        </center>


        <center class="cent">

            <h2>Current Price: $</h2>

            <div>

                <div class="menu">
                    <h3>Lettuce</h3>

                    <button class="button_menu1" id="morelettuce">
                        More
                    </button>

                    <button class="button_menu" id="lesslettuce" disabled>
                        Less
                    </button>
                </div>


                <div class="menu">
                    <h3>Bacon</h3>

                    <button class="button_menu1" id="morebacon">
                        More
                    </button>

                    <button class="button_menu" id="lessbacon" disabled>
                        Less
                    </button>
                </div>


                <div class="menu">
                    <h3>Cheese</h3>

                    <button class="button_menu1" id="morechees">
                        More
                    </button>

                    <button class="button_menu" id="lesschees" disabled>
                        Less
                    </button>
                </div>


                <div class="menu">
                    <h3>Meat</h3>

                    <button class="button_menu1" id="moremeat">
                        More
                    </button>

                    <button class="button_menu" id="lessmeat" disabled>
                        Less
                    </button>
                </div>


                <button class="order" id="orderbutton" disabled>
                    ORDER NOW
                </button>

            </div>

        </center>

    </div>


    <script src="./script.js"></script>
</body>

</html>
