<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
        <nav class="navbar">

            <img src="./cute-cartoon-burger-as-builder-character-painting-flat-modern-style-design-illustration-258451882.webp"
                alt="Burger" width="50" height="50">

            <div class="btnhead">

                <button class="btn" id="burgerBuilder">
                    Burger Builder
                </button>

                <button class="btn" id="loginButton">
                    Login
                </button>

            </div>

        </nav>

        <center>

            <fieldset class="fieldset1">

                <h1>Customer Information</h1>


                <form id="customerForm">


                    <label>Name:</label>

                    <br>

                    <input type="text" id="customerName" placeholder="Enter Your Name" class="input1" required>

                    <br>
                    <br>


                    <label>Phone:</label>

                    <br>

                    <input type="tel" id="customerPhone" placeholder="Enter Your Number" class="input1" required>

                    <br>
                    <br>


                    <label>Address:</label>

                    <br>

                    <input type="text" id="customerAddress" placeholder="Enter Your Address" class="input1" required>

                    <br>
                    <br>


                    <label>Zip Code:</label>

                    <br>

                    <input type="text" id="customerZip" placeholder="Enter Your Zip Code" class="input1" required>

                    <br>
                    <br>


                    <label>Country:</label>

                    <br>

                    <input type="text" id="customerCountry" placeholder="Enter Your Country" class="input1" required>

                    <br>
                    <br>


                    <button type="submit" class="button11" id="orderButton" disabled>

                        ORDER

                    </button>


                </form>

            </fieldset>

        </center>


        <script src="./customer-info.js"></script>

</body>

</html>
