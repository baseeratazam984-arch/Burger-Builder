<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Burger Builder</title>
</head>

<body>
    <nav class="navbar">
        <img src="./cute-cartoon-burger-as-builder-character-painting-flat-modern-style-design-illustration-258451882.webp"
            alt="" width="50" lenght="50">
        <div class="btnhead">
            <button class="btn" id="burger-builder-log-in-page">Burger Builder</button>
            <button class="btn" id="log-in">Login</button>
        </div>
    </nav>

    <center>
        <div>
            <fieldset class="fieldset">
                <p class="invalid-email">INVALID_EMAIL</p>
                <form align="center">
                    <input type="email" placeholder="E_mail Address" autocomplete="on" autocorrect="on">
                    <br>
                    <br>
                    <input type="password" placeholder="password" autocorrect="on">
                </form>
                <button class="submit" id="submit">SUBMIT</button>
                <br>
                <button class="sign-in" id="sign-in">SIGN IN</button>
            </fieldset>
        </div>
    </center>
    <script src="./navigation.js"></script>

</body>

</html>
